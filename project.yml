name: SportsPedia
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.dicoding.SportsPedia
packages:
  SportsPediaModules:
    path: SportsPediaModules
targets:
  SportsPedia:
    type: application
    platform: iOS
    sources:
      - SportsPedia
    dependencies:
      - package: SportsPediaModules
        product: SportsPediaData
    settings:
      base:
        API_V2_KEY: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: SportsPedia
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
