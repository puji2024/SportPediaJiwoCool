name: iOS Delivery

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  archive:
    name: Archive release candidate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve local package
        run: >-
          xcodebuild -resolvePackageDependencies
          -project SportsPedia.xcodeproj
          -scheme SportsPedia
      - name: Create unsigned iOS archive
        run: >-
          xcodebuild archive
          -project SportsPedia.xcodeproj
          -scheme SportsPedia
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath build/SportsPedia.xcarchive
          CODE_SIGNING_ALLOWED=NO
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: SportsPedia-${{ github.ref_name }}-unsigned
          path: build/SportsPedia.xcarchive
          if-no-files-found: error
