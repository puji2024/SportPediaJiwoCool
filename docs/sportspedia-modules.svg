<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Arsitektur modular SportsPedia</title>
  <desc id="desc">App menghubungkan local package Common, Data, Domain, Teams, Favorites, dan Profile. Data menggunakan Common dan Domain; Teams menggunakan Domain; Favorites menggunakan Teams dan Domain. Needle menghubungkan App ke repository Data melalui kontrak Domain.</desc>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;fill:#152238}.title{font-size:27px;font-weight:700}.label{font-size:20px;font-weight:700}.sub{font-size:14px;fill:#516174}.small{font-size:13px;fill:#516174}.box{stroke-width:2;rx:18}.arrow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 6}.note{font-size:13px;fill:#8a541b}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1120" height="620" fill="#f8fafc"/>
  <text x="560" y="43" text-anchor="middle" class="title">SportsPedia — local Swift Package modularization</text>
  <text x="560" y="67" text-anchor="middle" class="small">Satu Git repository · package berada di dalam folder SportsPedia</text>

  <rect class="box" x="440" y="96" width="240" height="82" fill="#ffbf4d" stroke="#c67d05"/>
  <text x="560" y="128" text-anchor="middle" class="label">App</text>
  <text x="560" y="151" text-anchor="middle" class="sub">AppComponent · RootView</text>

  <rect class="box" x="72" y="236" width="200" height="100" fill="#e2f0ff" stroke="#247bbd"/>
  <text x="172" y="270" text-anchor="middle" class="label">Teams</text>
  <text x="172" y="294" text-anchor="middle" class="sub">List · Filter · Detail</text>
  <text x="172" y="316" text-anchor="middle" class="small">Feature package</text>

  <rect class="box" x="322" y="236" width="200" height="100" fill="#fee7ef" stroke="#c44975"/>
  <text x="422" y="270" text-anchor="middle" class="label">Favorites</text>
  <text x="422" y="294" text-anchor="middle" class="sub">Saved teams</text>
  <text x="422" y="316" text-anchor="middle" class="small">Feature package</text>

  <rect class="box" x="572" y="236" width="200" height="100" fill="#eee8ff" stroke="#755ac7"/>
  <text x="672" y="270" text-anchor="middle" class="label">Profile</text>
  <text x="672" y="294" text-anchor="middle" class="sub">Developer profile</text>
  <text x="672" y="316" text-anchor="middle" class="small">Feature package</text>

  <rect class="box" x="822" y="236" width="226" height="100" fill="#e1f6e8" stroke="#278a50"/>
  <text x="935" y="270" text-anchor="middle" class="label">Domain</text>
  <text x="935" y="294" text-anchor="middle" class="sub">Team · contracts · use cases</text>
  <text x="935" y="316" text-anchor="middle" class="small">Domainless package</text>

  <rect class="box" x="332" y="430" width="220" height="104" fill="#ffe9dc" stroke="#c96b30"/>
  <text x="442" y="464" text-anchor="middle" class="label">Data</text>
  <text x="442" y="488" text-anchor="middle" class="sub">TheSportsDB v1 · Core Data</text>
  <text x="442" y="510" text-anchor="middle" class="small">Domainless package</text>

  <rect class="box" x="680" y="430" width="220" height="104" fill="#eee5fb" stroke="#7856ad"/>
  <text x="790" y="464" text-anchor="middle" class="label">Common</text>
  <text x="790" y="488" text-anchor="middle" class="sub">SportsPediaAPI · Needle</text>
  <text x="790" y="510" text-anchor="middle" class="small">Domainless package</text>

  <path class="arrow" d="M485 178 L208 236"/>
  <path class="arrow" d="M530 178 L455 236"/>
  <path class="arrow" d="M590 178 L642 236"/>
  <path class="arrow" d="M655 178 L880 236"/>
  <path class="arrow" d="M322 286 L272 286"/>
  <path class="arrow" d="M172 336 C172 390 760 390 880 336"/>
  <path class="arrow" d="M422 336 C422 415 790 415 900 336"/>
  <path class="arrow" d="M442 430 L830 336"/>
  <path class="arrow" d="M552 482 L680 482"/>
  <path class="arrow dashed" d="M560 178 L470 430"/>
  <text x="492" y="390" text-anchor="middle" class="note">Needle provides TeamRepository</text>

  <text x="560" y="586" text-anchor="middle" class="small">Arrow points toward the package being depended on. Profile has no package dependency.</text>
